[package]
name = "iris-link"
version = "0.1.0"
description = "iris-link côté app Tauri 2 : rend une app pilotable par un assistant via named pipe (Windows) + capture d'écran"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tauri = { version = "2" }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
dirs = "5"
chrono = "0.4"
png = "0.17"
iris-store = { path = "../iris-store" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }
